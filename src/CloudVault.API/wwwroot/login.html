<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - CloudVault</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-4">
  <div class="container" style="max-width: 440px;">
    <div class="text-center mb-4">
      <a class="brand-logo justify-content-center" href="/">
        <div class="brand-icon">☁️</div>
        <span>CloudVault</span>
      </a>
      <h4 class="fw-bold mt-3 mb-1">Welcome back</h4>
      <p class="text-muted small">Sign in to manage your files and cloud storage</p>
    </div>

    <div class="cv-card shadow-sm border-0">
      <div id="error-alert" class="alert alert-danger d-none small py-2 mb-3"></div>

      <form id="login-form">
        <div class="mb-3">
          <label for="email" class="form-label small fw-semibold">Email Address</label>
          <input type="email" class="form-control" id="email" required placeholder="name@company.com" autocomplete="email">
        </div>

        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center">
            <label for="password" class="form-label small fw-semibold">Password</label>
          </div>
          <input type="password" class="form-control" id="password" required placeholder="••••••••" autocomplete="current-password">
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary w-100 py-2 fw-semibold">
          Sign In
        </button>
      </form>
    </div>

    <div class="text-center mt-3 small text-muted">
      Don't have an account? <a href="/register.html" class="fw-semibold text-primary text-decoration-none">Create account</a>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    if (api.isAuthenticated()) {
      window.location.href = '/dashboard.html';
    }

    const form = document.getElementById('login-form');
    const errorAlert = document.getElementById('error-alert');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.classList.add('d-none');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        await api.login(email, password);
        window.location.href = '/dashboard.html';
      } catch (err) {
        errorAlert.textContent = err.message || 'Login failed. Please verify credentials.';
        errorAlert.classList.remove('d-none');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
