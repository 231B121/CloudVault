<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - CloudVault</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-4">
  <div class="container" style="max-width: 480px;">
    <div class="text-center mb-4">
      <a class="brand-logo justify-content-center" href="/">
        <div class="brand-icon">☁️</div>
        <span>CloudVault</span>
      </a>
      <h4 class="fw-bold mt-3 mb-1">Create your CloudVault account</h4>
      <p class="text-muted small">Get 1 GB free secure cloud storage instantly</p>
    </div>

    <div class="cv-card shadow-sm border-0">
      <div id="error-alert" class="alert alert-danger d-none small py-2 mb-3"></div>

      <form id="register-form">
        <div class="mb-3">
          <label for="fullName" class="form-label small fw-semibold">Full Name</label>
          <input type="text" class="form-control" id="fullName" required placeholder="John Doe">
        </div>

        <div class="mb-3">
          <label for="email" class="form-label small fw-semibold">Email Address</label>
          <input type="email" class="form-control" id="email" required placeholder="john@example.com" autocomplete="email">
        </div>

        <div class="mb-3">
          <label for="password" class="form-label small fw-semibold">Password (min 8 characters)</label>
          <input type="password" class="form-control" id="password" required minlength="8" placeholder="••••••••" autocomplete="new-password">
        </div>

        <div class="mb-3">
          <label for="confirmPassword" class="form-label small fw-semibold">Confirm Password</label>
          <input type="password" class="form-control" id="confirmPassword" required minlength="8" placeholder="••••••••" autocomplete="new-password">
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary w-100 py-2 fw-semibold">
          Create Account
        </button>
      </form>
    </div>

    <div class="text-center mt-3 small text-muted">
      Already have an account? <a href="/login.html" class="fw-semibold text-primary text-decoration-none">Sign in</a>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    if (api.isAuthenticated()) {
      window.location.href = '/dashboard.html';
    }

    const form = document.getElementById('register-form');
    const errorAlert = document.getElementById('error-alert');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.classList.add('d-none');

      const fullName = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        errorAlert.textContent = 'Passwords do not match.';
        errorAlert.classList.remove('d-none');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account...';

      try {
        await api.register(fullName, email, password, confirmPassword);
        showToast('Account created successfully!', 'success');
        setTimeout(() => {
          window.location.href = '/dashboard.html';
        }, 500);
      } catch (err) {
        errorAlert.textContent = err.message || 'Registration failed. Please check inputs.';
        errorAlert.classList.remove('d-none');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
